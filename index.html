<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday Papa ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,dpr;
let particles=[];
let start=performance.now();

function resize(){

    dpr=Math.min(window.devicePixelRatio || 1,2);

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    createText();
}

window.addEventListener("resize",resize);


/* =========================
   CREATE TWO SEPARATE TEXT AREAS
========================= */

function createText(){

    const mask=document.createElement("canvas");

    mask.width=W;
    mask.height=H;

    const m=mask.getContext("2d");

    m.fillStyle="#000";
    m.fillRect(0,0,W,H);

    m.fillStyle="#fff";
    m.textAlign="center";
    m.textBaseline="middle";


    /*
       HAPPY BIRTHDAY
       TOP AREA ONLY
    */

    const happySize=Math.min(W*0.105,78);

    m.font=`900 ${happySize}px Arial`;

    m.fillText(
        "HAPPY BIRTHDAY",
        W/2,
        H*0.32
    );


    /*
       PAPA
       LOWER AREA ONLY
    */

    const papaSize=Math.min(W*0.18,125);

    m.font=`900 ${papaSize}px Arial`;

    m.fillText(
        "PAPA",
        W/2,
        H*0.68
    );


    const data=m.getImageData(
        0,
        0,
        W,
        H
    ).data;

    particles=[];


    /*
       LARGE GAP BETWEEN
       THE TWO WORDS
    */

    const gap=8;

    for(let y=0;y<H;y+=gap){

        for(let x=0;x<W;x+=gap){

            const index=
                (y*W+x)*4;

            if(data[index]>150){

                particles.push({

                    x:Math.random()*W,

                    y:Math.random()*H,

                    tx:x,

                    ty:y,

                    phase:Math.random()*Math.PI*2,

                    speed:.35+
                    Math.random()*.55

                });

            }

        }

    }

}


/* =========================
   ANIMATION
========================= */

function animate(now){

    const time=
        (now-start)/1000;


    ctx.fillStyle=
        "rgba(0,0,0,0.25)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    particles.forEach(p=>{

        p.x +=
            (p.tx-p.x)
            *0.025
            *p.speed;

        p.y +=
            (p.ty-p.y)
            *0.025
            *p.speed;


        const movement=
            Math.sin(
                time*2+
                p.phase
            )*1.2;


        ctx.save();

        ctx.translate(
            p.x+movement,
            p.y
        );


        ctx.rotate(
            Math.sin(
                time*.7+
                p.phase
            )*.05
        );


        ctx.fillStyle=
            "rgba(255,182,193,.95)";

        ctx.font=
            "bold 7px Arial";

        ctx.textAlign="center";

        ctx.textBaseline="middle";


        /*
           EVERY PARTICLE SAYS PAPA
        */

        ctx.fillText(
            "PAPA",
            0,
            0
        );


        ctx.restore();

    });


    requestAnimationFrame(animate);

}


resize();

requestAnimationFrame(animate);

</script>

</body>
</html>
