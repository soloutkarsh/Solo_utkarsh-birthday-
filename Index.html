
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Papa ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize(){
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    ctx.scale(devicePixelRatio, devicePixelRatio);

    W = window.innerWidth;
    H = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* --------------------------------
   TEXT MASK
-------------------------------- */

const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");

function createMask(){

    maskCanvas.width = W;
    maskCanvas.height = H;

    maskCtx.fillStyle = "black";
    maskCtx.fillRect(0,0,W,H);

    maskCtx.fillStyle = "white";
    maskCtx.textAlign = "center";
    maskCtx.textBaseline = "middle";

    let size = Math.min(W * 0.16, 125);

    maskCtx.font =
        "bold " + size + "px Arial";

    maskCtx.fillText(
        "HAPPY BIRTHDAY",
        W/2,
        H/2 - size * 0.55
    );

    maskCtx.fillText(
        "PAPA",
        W/2,
        H/2 + size * 0.65
    );
}

createMask();


/* --------------------------------
   FIND TEXT PIXELS
-------------------------------- */

let points = [];

function generatePoints(){

    points = [];

    const data =
        maskCtx.getImageData(
            0,
            0,
            W,
            H
        ).data;

    const gap = 7;

    for(let y=0; y<H; y+=gap){

        for(let x=0; x<W; x+=gap){

            const index =
                (y * W + x) * 4;

            if(data[index] > 150){

                points.push({
                    x:x,
                    y:y,
                    angle:Math.random()*Math.PI*2,
                    radius:Math.random()*20
                });

            }

        }

    }
}

generatePoints();


/* --------------------------------
   ANIMATION
-------------------------------- */

let progress = 0;

function animate(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    progress += 0.008;

    points.forEach((p,i)=>{

        const wave =
            Math.sin(
                progress * 3 +
                i * 0.03
            ) * 2;

        const x =
            p.x +
            Math.cos(p.angle) *
            p.radius *
            0.15;

        const y =
            p.y +
            Math.sin(p.angle) *
            p.radius *
            0.15 +
            wave;

        ctx.fillStyle =
            "rgba(255,182,193,0.9)";

        ctx.font =
            "bold 9px Arial";

        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.fillText(
            "PAPA",
            x,
            y
        );

    });

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
